version: '3.8'

networks:
  orders_net:
    driver: bridge

services:
  orders-service:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: orders_microservice
    networks:
      - orders_net
    # No se expone el puerto 8000 al host para garantizar segmentación

  gateway:
    image: nginx:alpine
    container_name: api_gateway_nginx
    ports:
      - "8443:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - orders_net
    depends_on:
      - orders-service